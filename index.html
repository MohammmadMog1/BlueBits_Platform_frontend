<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!--
      يضبط اللغة والاتجاه قبل أوّل رسم للصفحة.
      بدون هذا السكربت تُرسم الواجهة بالاتجاه الافتراضي ثم تنقلب عند إقلاع
      React، فيرى المستخدم "قفزة" في التخطيط. يجب أن يبقى متزامناً (بلا async)
      وفي أعلى <head> ليعمل قبل أي CSS.
      مفتاح التخزين مطابق لـ LANGUAGE_STORAGE_KEY في src/shared/i18n/config.ts
    -->
    <script>
      (function () {
        var SUPPORTED = { ar: "rtl", en: "ltr" };
        var lang;
        try {
          lang = new URLSearchParams(location.search).get("lang")
            || localStorage.getItem("bluebits.lang");
        } catch (e) {
          /* الوضع الخاص قد يمنع localStorage – نتابع بالافتراضي */
        }
        // لا نعتمد navigator.language عمداً – انظر تعليق `order` في
        // src/shared/i18n/index.ts. العربية هي الافتراضي.
        lang = String(lang || "ar").split("-")[0];
        if (!SUPPORTED[lang]) lang = "ar";

        var root = document.documentElement;
        root.lang = lang;
        root.dir = SUPPORTED[lang];
        root.dataset.lang = lang;
      })();
    </script>
    <link rel="icon"  href="/src/app/assets/Logo notext.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlueBits — Your University Life, Organized</title>
    <meta name="description" content="BlueBits is the all-in-one academic platform — lectures, exam scheduling, MCQ practice, AI tutoring, and smart task management in one elegant space." />
    <meta name="theme-color" content="#404293" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BlueBits — Your University Life, Organized" />
    <meta property="og:description" content="Lectures, exam scheduling, MCQ practice, AI tutoring, and smart task management in one elegant academic platform." />
    <meta property="og:image" content="/src/app/assets/Logo.png" />
    <meta name="twitter:card" content="summary" />
    <!-- الخط العربي محلّي: نحمّله مبكّراً لأنه يرسم معظم نصوص الواجهة -->
    <link
      rel="preload"
      href="/fonts/BoutrosMBCDinkum-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
